
{% extends 'base.html' %}

{% block title %}
Create Challenge - CTF Platform
{% endblock %}

{% block content %}

<h1>Add Challenge</h1>

<h2>Competition: {{ competition.name }}</h2>

<form method="POST">

    <!-- Challenge title -->
    <label for="title">Challenge Title:</label>
    <input type="text"
           id="title"
           name="title"
           maxlength="120"
           required>

    <br><br>

    <!-- Challenge description -->
    <label for="description">Description:</label>
    <textarea id="description"
              name="description"
              rows="4"
              required></textarea>

    <br><br>

    <!-- Challenge category -->
    <label for="category">Category:</label>
    <select id="category"
            name="category"
            required>
        <option value="">Select Category</option>
        <option value="Web">Web</option>
        <option value="Cryptography">Cryptography</option>
        <option value="Forensics">Forensics</option>
        <option value="Reverse Engineering">
            Reverse Engineering
        </option>
        <option value="Miscellaneous">Miscellaneous</option>
    </select>

    <br><br>

    <!-- Challenge points -->
    <label for="points">Points:</label>
    <input type="number"
           id="points"
           name="points"
           min="1"
           required>

    <br><br>

    <!-- Correct flag -->
    <label for="flag">Correct Flag:</label>
    <input type="password"
           id="flag"
           name="flag"
           maxlength="255"
           required>

    <br><br>

    <button type="submit">
        Add Challenge
    </button>

</form>

<p>
    <a href="{{ url_for('main.dashboard') }}">
        Back to Dashboard
    </a>
</p>

{% endblock %}
