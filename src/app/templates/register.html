{% extends 'base.html' %}{% block title %}Register — CTF Platform{% endblock %}{% block content %}<h1>Create an account</h1><form method="post"><label for="name">Name</label><input id="name" name="name" required maxlength="120" value="{{ request.form.get('name','') }}"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="255" value="{{ request.form.get('email','') }}"><label for="password">Password (12 characters minimum)</label><input id="password" name="password" type="password" required minlength="12"><label for="role">Role</label><select id="role" name="role" required><option value="">Select role</option><option value="participant" {% if request.form.get('role') == 'participant' %}selected{% endif %}>Participant</option><option value="organizer" {% if request.form.get('role') == 'organizer' %}selected{% endif %}>Organizer</option></select><button type="submit">Submit</button></form>{% endblock %}
